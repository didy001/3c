<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3C - Architecture Système</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Inter:wght@300;400;500;600;700&display=swap');
      
      body {
        background-color: #030304;
        color: #e4e4e7;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
      }
      
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Scrollbar Invisible but functional */
      .custom-scrollbar::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      .custom-scrollbar {
        scrollbar-width: none;
      }

      /* FLUID ANIMATIONS */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }

      @keyframes pulse-glow {
        0%, 100% { opacity: 0.5; filter: blur(8px); }
        50% { opacity: 0.8; filter: blur(12px); }
      }

      @keyframes flow-line {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }

      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      .animate-pulse-glow {
        animation: pulse-glow 4s ease-in-out infinite;
      }

      .glass-panel {
        background: rgba(10, 10, 12, 0.4);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.03);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      /* Focus styles for inputs */
      input:focus, textarea:focus, select:focus {
        background-color: rgba(20, 20, 25, 0.8) !important;
        border-color: rgba(6, 182, 212, 0.4) !important;
        box-shadow: 0 0 15px rgba(6, 182, 212, 0.1);
        transition: all 0.3s ease;
      }
    </style>
